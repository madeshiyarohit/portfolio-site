# Builds the site and publishes it to GitHub Pages every time something is pushed to the main branch
# (including posts and projects added through Pages CMS).
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: withastro/action@v6
        with:
          node-version: 24

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
      # Tell Bing and other IndexNow search engines about every page, so changes are picked up within minutes.
      # The key must match src/site.config.mjs (indexNowKey) and the file public/<key>.txt.
      - name: Ping IndexNow
        continue-on-error: true
        env:
          KEY: 7aba602ff8a8d080ea660f36edad868e
          HOST: flexiroot.in
        run: |
          sleep 20
          URLS=$(curl -fsS "https://$HOST/sitemap.xml" | grep -o '<loc>[^<]*</loc>' | sed 's/<[^>]*>//g' | jq -R . | jq -sc .)
          curl -sS -X POST https://api.indexnow.org/indexnow -H "Content-Type: application/json; charset=utf-8" \
            -d "{\"host\":\"$HOST\",\"key\":\"$KEY\",\"keyLocation\":\"https://$HOST/$KEY.txt\",\"urlList\":$URLS}" -w "IndexNow response: %{http_code}\n"
